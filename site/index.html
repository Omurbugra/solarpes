<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enerji Renovasyon Senaryoları · SolarPES</title>
<meta name="description" content="Ankara'daki bir devlet okulunda dokuz enerji renovasyon önlemini 3B model üzerinde keşfedin.">
<link rel="preload" href="assets/school.glb" as="fetch" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-roof" viewBox="0 0 24 24"><path d="M3 11l9-6 9 6"/><path d="M5 10v9h14v-9"/></symbol>
    <symbol id="i-wall" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16"/><path d="M3 10h18M3 15h18M9 4v6M15 10v5M9 15v5"/></symbol>
    <symbol id="i-window" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16M4 12h16"/></symbol>
    <symbol id="i-ground" viewBox="0 0 24 24"><path d="M3 9h18"/><path d="M3 14l3-3M8 14l3-3M13 14l3-3M18 14l3-3"/><path d="M3 19h18"/></symbol>
    <symbol id="i-shade" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M12 2v1.5M18 8h-1.5M6 8H4.5M16 4l-1 1M8 4l1 1"/><path d="M4 14h16M6 18h12"/></symbol>
    <symbol id="i-pv" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="11" rx="1"/><path d="M3 9h18M3 12.5h18M9 5v11M15 5v11"/><path d="M12 16v3M9 22h6"/></symbol>
    <symbol id="i-hp" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/><circle cx="9" cy="12" r="3"/><path d="M9 9v6M6 12h6M16 10v4M19 10v4"/></symbol>
    <symbol id="i-iod" viewBox="0 0 24 24"><path d="M10 13V5a2 2 0 0 1 4 0v8a4 4 0 1 1-4 0z"/><path d="M12 13v-4"/></symbol>
    <symbol id="i-energy" viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-11h-6z"/></symbol>
    <symbol id="i-emis" viewBox="0 0 24 24"><path d="M7 17h10a3 3 0 0 0 0-6 4.5 4.5 0 0 0-8.7-1.5A3.2 3.2 0 0 0 7 17z"/></symbol>
    <symbol id="i-cost" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9h4M9 12.5h4.5M11 7.5v9M9.5 14.5c.6 1 2 1.4 3 .6"/></symbol>
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10"/><path d="M4 20h16"/><path d="M9 20v-5h6v5"/><path d="M7 12h1.5M15.5 12H17"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4h4"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-14.3 4.9"/><path d="M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18 3v4.5h-4.5M6 21v-4.5h4.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
  </defs>
</svg>

<header class="top">
  <a class="brand" href="#"><svg class="ico"><use href="#i-mark"/></svg><span>SolarPES<small data-i18n="brandSub">Okul enerji renovasyonu</small></span></a>
  <div class="top-r">
    <div class="lang" role="group" aria-label="Dil / Language">
      <button type="button" data-lang="tr" aria-pressed="true">TR</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="theme" id="themeBtn" type="button" data-i18n-aria="theme" aria-label="Tema değiştir"><span></span></button>
  </div>
</header>

<main class="wrap">
  <section class="head">
    <div>
      <span class="kicker" data-i18n="kicker">Bir bakışta</span>
      <h1 data-i18n="h1">Enerji renovasyon senaryoları</h1>
    </div>
    <p data-i18n="lead">Model üzerinde bir sisteme gelin, parlasın; tıklayın, model o sisteme yaklaşsın. Yapısı ve dört indikatöre etkisi yanda açılır.</p>
  </section>

  <section class="stage" id="stage" data-i18n-aria="stage" aria-label="Okul 3B modeli">
    <div class="gl" id="gl"></div>
    <div class="pins" id="pins"></div>
    <div class="tip" id="tip" role="status"></div>

    <div class="hud tl" id="hint"><span class="dot"></span><span data-i18n="hint">Sürükle: döndür · Kaydır: yakınlaş · Tıkla: incele</span></div>
    <div class="hud tr ctl">
      <button type="button" id="rotBtn" data-i18n-title="rot" title="Otomatik döndür" aria-pressed="false"><svg class="ico"><use href="#i-rotate"/></svg></button>
      <button type="button" id="homeBtn" data-i18n-title="home" title="Başa dön"><svg class="ico"><use href="#i-reset"/></svg></button>
    </div>

    <nav class="dock" id="dock" aria-label="Sistemler"></nav>

    <div class="bigview" id="bigView">
      <button type="button" class="big-close" id="bigClose" data-i18n-aria="bigClose" aria-label="Büyük görünümü kapat"><svg class="ico"><use href="#i-close"/></svg></button>
    </div>

    <aside class="panel" id="panel" aria-hidden="true" aria-live="polite">
      <div class="p-top">
        <span class="p-idx mono" id="pIdx">01 / 09</span>
        <div class="p-nav">
          <button type="button" id="pPrev" data-i18n-aria="prev" aria-label="Önceki sistem"><svg class="ico"><use href="#i-prev"/></svg></button>
          <button type="button" id="pNext" data-i18n-aria="next" aria-label="Sonraki sistem"><svg class="ico"><use href="#i-next"/></svg></button>
          <button type="button" id="pClose" data-i18n-aria="close" aria-label="Kapat"><svg class="ico"><use href="#i-close"/></svg></button>
        </div>
      </div>
      <div class="p-scroll" id="pScroll">
        <span class="kicker" id="pTag"></span>
        <div class="p-head"><span class="p-ico"><svg class="ico"><use id="pIco" href="#i-wall"/></svg></span><h2 id="pTitle"></h2></div>
        <figure class="mini" id="mini">
          <div class="mini-gl" id="miniGl"></div>
          <figcaption><svg class="ico"><use href="#i-cube"/></svg><span id="miniCap">Detay modeli</span></figcaption>
          <button type="button" class="mini-expand" id="miniBig" data-i18n-title="big" title="Detayı büyüt" aria-pressed="false" hidden><svg class="ico"><use href="#i-expand"/></svg></button>
        </figure>
        <ol class="legend" id="pLegend" hidden></ol>
        <div id="pBody"></div>
        <div class="eff" id="pEff"></div>
      </div>
    </aside>

    <div class="loader" id="loader">
      <div class="ld-box">
        <svg class="ico"><use href="#i-mark"/></svg>
        <span class="mono"><span data-i18n="loading">Model yükleniyor</span> <b id="ldPct">0%</b></span>
        <i><em id="ldBar"></em></i>
      </div>
    </div>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
